import javax.inject.Inject
import org.gradle.process.ExecOperations

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'idea'
}

// Gradle 9 removed Project.javaexec; ExecOperations is injected through a
// managed holder object instead.
abstract class ZioExecOps {
    @Inject
    abstract ExecOperations getOps()
}
def zioExecOps = project.objects.newInstance(ZioExecOps).ops

base { archivesName = 'zio' }

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeGroup 'net.fabricmc'; includeGroup 'fabricmc' }
    }
    ivy {
        url = 'https://raw.githubusercontent.com/m1919810/SlimefunHelper/1.21.11/libs'
        patternLayout { artifact 'baritone-meteor-[revision].jar' }
        metadataSources { artifact() }
        content { includeModule 'meteordevelopment', 'baritone' }
    }
}

configurations {
    baritoneDistribution { transitive = false }
    viaDistribution { transitive = false }
    remapperTool { transitive = false }
}

def externalApiDir = layout.buildDirectory.dir('external-api')
def legacyMappingsFile = layout.projectDirectory.file('gradle/legacy/1.21.11-mappings.tiny')
def remappedDir = layout.projectDirectory.dir('build/legacy-remap')

// The upstream Baritone 1.21.11 jar is compiled against intermediary vanilla names
// (class_2338 etc.). This port compiles against the unobfuscated official names of
// 26.1.2, so the integration jar is remapped intermediary -> named once here with
// tiny-remapper (the same operation Loom's modCompileOnly used to perform on 1.21.11).
tasks.register('remapLegacyBaritone') {
    dependsOn configurations.remapperTool, configurations.baritoneDistribution
    inputs.file(legacyMappingsFile)
    def baritoneNamed = remappedDir.file('baritone-named.jar')
    def netherNamed = remappedDir.file('nether-pathfinder-named.jar')
    outputs.file(baritoneNamed); outputs.file(netherNamed)
    doLast {
        def out = remappedDir.asFile
        out.mkdirs()
        def jar = configurations.baritoneDistribution.singleFile
        zioExecOps.javaexec {
            classpath = configurations.remapperTool
            mainClass = 'net.fabricmc.tinyremapper.Main'
            args jar.absolutePath,
                 out.toPath().resolve('baritone-named.jar').toAbsolutePath().toString(),
                 legacyMappingsFile.asFile.absolutePath,
                 'intermediary', 'named'
        }
        def nested = new File(out, 'nether-pathfinder.jar')
        copy {
            from zipTree(jar)
            include 'META-INF/jars/nether-pathfinder-*.jar'
            into out
        }
        def nestedJar = fileTree(dir: out, include: 'META-INF/jars/nether-pathfinder-*.jar').singleFile
        zioExecOps.javaexec {
            classpath = configurations.remapperTool
            mainClass = 'net.fabricmc.tinyremapper.Main'
            args nestedJar.absolutePath,
                 out.toPath().resolve('nether-pathfinder-named.jar').toAbsolutePath().toString(),
                 legacyMappingsFile.asFile.absolutePath,
                 'intermediary', 'named'
        }
        fileTree(dir: out, include: 'META-INF/**').each { it.delete() }
    }
}

// Unbunks the nested library jars of the compile-only moder integrations
// (Baritone's nether-pathfinder, ViaFabricPlus' ViaVersion/ViaBedrock stack)
// so their API surfaces are resolvable without becoming runtime dependencies.
// PORT_PLAN §0 rule 6: integrations stay inert at runtime until their P5 phase.
// Only ViaFabricPlus is extracted raw here; Baritone is consumed remapped
// (intermediary -> named) by the remapLegacyBaritone task above.
def extractExternalApi = tasks.register('extractExternalApi') {
    def configs = [configurations.viaDistribution]
    inputs.files(provider { configs.collectMany { c -> c.files } })
    outputs.dir(externalApiDir)
    doLast {
        def out = externalApiDir.get().asFile
        out.mkdirs()
        configs.each { config ->
            config.files.each { jar ->
                ant.unzip(src: jar, dest: out, overwrite: 'true')
            }
        }
        // second pass: expose the classes of nested library jars (nether-pathfinder, ViaVersion, ...)
        fileTree(dir: out, include: 'META-INF/jars/*.jar').files.each { nested ->
            ant.unzip(src: nested, dest: out, overwrite: 'true') {
                patternset { include(name: '**/*.class') }
            }
        }
        // drop extracted packaging metadata so only class files remain on the compile classpath
        fileTree(dir: out).files.findAll { it.path.contains('META-INF') || it.name.endsWith('.jar') }.each {
            it.delete()
        }
        // ViaFabricPlus bundles a legacy (intermediary-mapped) copy of fabric-api's
        // networking classes in jar-in-jar form. Stripping net/** keeps the real
        // fabric-api 0.155.3 implementation classes first on the compile classpath.
        fileTree(dir: out).files.findAll { it.path.startsWith(out.path + '/net/') }.each {
            it.delete()
        }
        new File(out, 'net').delete()
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'org.jetbrains:annotations:26.0.2'

    // 26.1.2 builds for these integrations do not exist yet (PORT_PLAN §0 rule 6):
    // compile against their 1.21.11 API only; Disabled* adapters keep them inert at runtime.
    baritoneDistribution 'meteordevelopment:baritone:1.21.11'
    viaDistribution 'maven.modrinth:viafabricplus:YzQYJEjP'
    remapperTool 'net.fabricmc:tiny-remapper:0.15.0'
    remapperTool 'org.ow2.asm:asm:9.10.1'
    remapperTool 'org.ow2.asm:asm-tree:9.10.1'
    remapperTool 'org.ow2.asm:asm-commons:9.10.1'
    remapperTool 'org.ow2.asm:asm-util:9.10.1'
    remapperTool 'net.fabricmc:mapping-io:0.8.0'

    compileOnly files(configurations.viaDistribution)
    compileOnly files(tasks.named('extractExternalApi'))
    compileOnly 'maven.modrinth:xaeros-minimap:62EynHPJ'

    // 26.1.2 optimization/utility builds (compileOnly API surfaces only):
    compileOnly 'maven.modrinth:lithium:mc26.1.2-0.24.7-fabric'
    compileOnly 'maven.modrinth:immediatelyfast:1.15.3+26.1-fabric'
    compileOnly 'maven.modrinth:entityculling:1.11.3'
    compileOnly 'maven.modrinth:sodium:mc26.1.2-0.9.2-fabric'

    // Baritone compiled against intermediary names; consume the remapped artifacts.
    compileOnly files(remappedDir.file('baritone-named.jar'))
    compileOnly files(remappedDir.file('nether-pathfinder-named.jar'))
}

loom {
    accessWidenerPath = file('src/main/resources/zio.accesswidener')
    runs {
        client {
            client()
            name = 'Zio Source'
            runDir = 'run'
            ideConfigGenerated = true
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.memoryMaximumSize = '4g'
}

tasks.named('compileJava') {
    dependsOn tasks.named('remapLegacyBaritone')
}

tasks.named('runClient') {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

idea.module {
    excludeDirs += files('run', '.gradle')
    downloadSources = true
}
