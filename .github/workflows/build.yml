name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Collect jars
        run: |
          mkdir -p dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zio-jars
          path: dist/*.jar

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "zio ${GITHUB_REF_NAME#v} for Minecraft 26.1.2" \
            --notes "Port of the open-zio client to Minecraft 26.1.2 (Fabric).

          **Requires:** Fabric Loader, Fabric API.

          **Optional integrations** (not bundled; the client stays functional without them):
          - Baritone Meteor (pathfinding)
          - ViaFabricPlus (legacy protocol versions)

          **Install:** drop the jar into your \`mods\` folder."
